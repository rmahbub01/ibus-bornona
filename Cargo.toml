[package]
name = "ibus-bornona"
version = "1.0.0"
edition = "2021"
authors = ["Mahbub Rahman <creative.mahbubrahman@gmail.com>", "Bornona Contributors"]
description = "Bornona Bengali Fixed Layout Input Method for IBus"
license = "GPL-3.0-or-later"
repository = "https://github.com/rmahbub01/ibus-bornona"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[build-dependencies]
pkg-config = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
