<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="4" y="4" width="120" height="120" rx="26" ry="26" fill="url(#bg)" stroke="#2dd4bf" stroke-width="3" filter="url(#shadow)"/>

  <!-- Keyboard accent bar -->
  <rect x="26" y="102" width="76" height="8" rx="4" ry="4" fill="#ccfbf1" opacity="0.9"/>

  <!-- Stylized Bengali Letter 'ব' -->
  <text x="64" y="84" font-family="'Noto Sans Bengali', 'Lohit Bengali', 'SutonnyMJ', sans-serif" font-size="74" font-weight="bold" fill="#ffffff" text-anchor="middle">ব</text>
</svg>
